<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

  <p id="msg" style="color:red;"></p>

  <p>Don't have an account? <span onclick="showSignup()">Signup</span></p>
</div>

<div class="container hidden" id="signupBox">
  <h2>Signup</h2>

  <input type="email" id="signupEmail" placeholder="Enter Email">
  <input type="password" id="signupPassword" placeholder="Enter Password">

  <button onclick="signup()">Signup</button>

  <p id="signupMsg" style="color:green;"></p>

  <p>Already have an account? <span onclick="showLogin()">Login</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
